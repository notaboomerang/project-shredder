[theme]
base = "dark"
primaryColor = "#e8ff53"
backgroundColor = "#0a0a0c"
secondaryBackgroundColor = "#111114"
textColor = "#ececef"
font = "monospace"

# NOTE: server port/address/CORS are intentionally NOT set here. Streamlit Cloud
# manages its own port (8501) + networking; hardcoding a port broke the cloud
# health check. The local PHONE setup (run_phone.py) passes --server.port 8666,
# --server.address 0.0.0.0, --server.enableCORS false, etc. as CLI flags, so the
# desktop/phone experience is unchanged without those flags living in this file.
[server]
headless = true

[browser]
gatherUsageStats = false
